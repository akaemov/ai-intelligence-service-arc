name: Исследование спроса
on:
  workflow_dispatch:
    inputs:
      parameters:
        description: 'JSON: mode, regions, cities, industries, segments, services, groups, days, compare_days и лимиты'
        required: false
        default: '{}'
        type: string
      publish:
        description: 'Опубликовать обезличенный отчёт, в том числе честно обозначенное частичное покрытие'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: research-russia
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Сохранить предыдущий публичный отчёт
        run: |
          python - <<'PY'
          import subprocess,json
          from pathlib import Path
          from src.publishing.export import publish
          remote=subprocess.check_output(['git','ls-remote','origin','refs/heads/gh-pages'],text=True).strip()
          if remote:
              subprocess.run(['git','fetch','origin','gh-pages'],check=True)
              result=subprocess.run(['git','show','FETCH_HEAD:data/latest.json'],capture_output=True,text=True)
              if result.returncode==0:publish(json.loads(result.stdout),Path('web/public/data/latest.json'))
          PY
      - name: Проверить параметры
        env:
          PARAMETERS: ${{ inputs.parameters }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from src.run import validate_config
          params=json.loads(os.environ['PARAMETERS'])
          allowed={'mode','regions','cities','industries','segments','services','groups','days','compare_days','max_requests','max_pages','max_seconds','max_api_budget','per_region_observations','per_source_pages','per_source_requests'}
          if not isinstance(params,dict) or not set(params)<=allowed:raise ValueError('Unknown parameters')
          config=json.loads(Path('config/research.json').read_text());config.update(params)
          validate_config(config)
          Path('.state').mkdir(exist_ok=True)
          Path('.state/run-config.json').write_text(json.dumps(config,ensure_ascii=False))
          PY
      - run: python -m unittest discover -s tests -v
      - name: Реальный сбор, без подмены ошибок пустым спросом
        run: |
          code=0
          python -u -m src.run --config .state/run-config.json || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          test -f web/public/data/attempt.json
      - name: Проверка публикации и отчёт покрытия
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from src.publishing.export import privacy_check
          for p in Path('web/public/data').glob('*.json'):privacy_check(json.loads(p.read_text()))
          report=json.loads(Path('web/public/data/attempt.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Статус: '+report['run']['status']+'; реестр: '+str(len(report['observations']))+'\n\n')
              f.write('Минимальное техническое покрытие: '+str(report['summary']['minimum_ready'])+'; полнота российского рынка не подтверждена.\n\n')
              for s in report['coverage']:f.write('- '+s['name']+': '+s['status']+' '+str(s.get('error') or '')+'\n')
          PY
      - run: npm ci --ignore-scripts && npm test && npm run build -- --base=/${{ github.event.repository.name }}/
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: public-research-report
          path: web/dist
          retention-days: 30
      - name: Публикация в настроенную ветку GitHub Pages
        if: inputs.publish
        run: |
          touch web/dist/.nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish_branch.py web/dist gh-pages --message 'Publish verified research site; coverage disclosed in report'
