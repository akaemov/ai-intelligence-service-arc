name: Реальный сбор России
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/collect-russia.yml]
permissions:
  contents: write
concurrency:
  group: research-russia
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Выполнить реальный сбор
        run: |
          code=0
          python -u -m src.run || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          test -f web/public/data/attempt.json
      - name: Обезличенные результаты для проверки (не внутренняя БД)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish_branch.py web/public/data research-data --message 'Publish real Russia collection report after privacy gate'
