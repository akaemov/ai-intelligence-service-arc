name: Проверка источников России
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/discover-sources.yml]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/discover_sources.py
